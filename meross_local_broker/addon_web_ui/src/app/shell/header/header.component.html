<mat-toolbar class="mat-elevation-z6 navbar" color="primary">
  <a class="brand" routerLink="/home" routerLinkActive="active" translate>APP_NAME</a>
  <span fxFlex></span>
  <button mat-icon-button [matMenuTriggerFor]="appMenu" aria-label="More options">
    <mat-icon>more_horiz</mat-icon>
  </button>
  <mat-menu #appMenu="matMenu">
    <button mat-menu-item routerLink="/wizard">
      <mat-icon>auto_awesome</mat-icon>
      <span translate>Setup</span>
    </button>
    <button mat-menu-item routerLink="/status">
      <mat-icon>poll</mat-icon>
      <span translate>Service Status</span>
    </button>
    <button mat-menu-item routerLink="/about">
      <mat-icon>info</mat-icon>
      <span translate>About</span>
    </button>
  </mat-menu>
</mat-toolbar>
