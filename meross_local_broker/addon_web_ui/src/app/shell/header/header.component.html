<mat-toolbar class="mat-elevation-z6 navbar" color="primary">
  <button *ngIf="showBackButton" mat-icon-button (click)="backToDevices()" aria-label="Back to devices">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <a class="brand" routerLink="/home" routerLinkActive="active" translate>APP_NAME</a>
  <span fxFlex></span>
  <button mat-icon-button [matMenuTriggerFor]="appMenu" aria-label="More options">
    <mat-icon>more_horiz</mat-icon>
  </button>
  <mat-menu #appMenu="matMenu">
    <button mat-menu-item [matMenuTriggerFor]="setupMenu">
      <mat-icon>build</mat-icon>
      <span translate>Setup</span>
    </button>
    <button mat-menu-item routerLink="/about">
      <mat-icon>info</mat-icon>
      <span translate>About</span>
    </button>
  </mat-menu>
  <mat-menu #setupMenu="matMenu">
    <button mat-menu-item routerLink="/setup/credentials">
      <mat-icon>key</mat-icon>
      <span>Broker access</span>
    </button>
    <button mat-menu-item routerLink="/setup/pairer">
      <mat-icon>android</mat-icon>
      <span>Pairer app</span>
    </button>
    <button mat-menu-item routerLink="/setup/pairing">
      <mat-icon>devices_other</mat-icon>
      <span>Pair devices</span>
    </button>
    <button mat-menu-item routerLink="/setup/home-assistant">
      <mat-icon>home</mat-icon>
      <span>Home Assistant</span>
    </button>
  </mat-menu>
</mat-toolbar>
