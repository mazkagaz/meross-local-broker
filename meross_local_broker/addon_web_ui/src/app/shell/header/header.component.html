<mat-toolbar class="mat-elevation-z6 navbar" color="primary">
  <button *ngIf="showBackButton" mat-icon-button (click)="backToDevices()" aria-label="Back to devices">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <a class="brand" routerLink="/home" routerLinkActive="active" translate>APP_NAME</a>
  <span fxFlex></span>
  <a
    mat-icon-button
    class="nav-icon"
    routerLink="/setup"
    routerLinkActive="active"
    matTooltip="Setup"
    aria-label="Setup"
  >
    <mat-icon>build</mat-icon>
  </a>
  <a
    mat-icon-button
    class="nav-icon"
    routerLink="/pair-devices"
    routerLinkActive="active"
    matTooltip="Pair devices"
    aria-label="Pair devices"
  >
    <mat-icon>android</mat-icon>
  </a>
  <a
    mat-icon-button
    class="nav-icon"
    routerLink="/tuning"
    routerLinkActive="active"
    matTooltip="Tuning"
    aria-label="Tuning"
  >
    <mat-icon>tune</mat-icon>
  </a>
  <a
    mat-icon-button
    class="nav-icon"
    routerLink="/about"
    routerLinkActive="active"
    matTooltip="About"
    aria-label="About"
  >
    <mat-icon>info</mat-icon>
  </a>
</mat-toolbar>
