name: Standalone

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  smoke:
    name: Standalone Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run the standalone container
        run: bash tools/test_standalone_docker.sh

      - name: Container logs on failure
        if: failure()
        run: docker logs meross-standalone-smoke 2>&1 | tail -100
