name: Security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-broker-python

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r meross_local_broker/rootfs/opt/custom_broker/requirements.txt
          pip-audit -r meross_local_broker/rootfs/opt/custom_broker/requirements_ci.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meross_local_broker/addon_web_ui/package-lock.json

      - name: Audit Web UI dependencies
        working-directory: meross_local_broker/addon_web_ui
        run: |
          npm ci
          npm audit --audit-level=high
