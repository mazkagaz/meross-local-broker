# Modified or added for the MRS100 fork of ha-meross-local-broker (2026-11).
# Upstream: https://github.com/albertogeniola/ha-meross-local-broker (Apache-2.0).
name: Builder

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  packages: write

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: meross_local_broker

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read add-on version
        id: version
        run: |
          VERSION=$(grep -E '^version:' meross_local_broker/config.yaml \
            | head -1 | awk '{print $2}' | tr -d '"')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meross_local_broker/addon_web_ui/package-lock.json

      - name: Align Web UI version with add-on version
        working-directory: meross_local_broker/addon_web_ui
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build Web UI
        working-directory: meross_local_broker/addon_web_ui
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm i
          npm run-script build

      - name: Build ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          version: ${{ needs.prepare.outputs.version }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          context: meross_local_broker
          push: ${{ github.event_name == 'push' }}
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
