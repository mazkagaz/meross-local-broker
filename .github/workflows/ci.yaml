name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MEROSS_CLOUD_REPO: ${{ github.workspace }}/cloud-src

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out the integration profile engine (pinned)
        uses: actions/checkout@v7
        with:
          repository: mazkagaz/meross-local-cloud
          ref: 78c0e10eb1ff627e75ef07d243462402ea11f814
          path: cloud-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            meross_local_broker/rootfs/opt/custom_broker/requirements_ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r meross_local_broker/rootfs/opt/custom_broker/requirements_ci.txt

      - name: Check the shared profile engine
        run: |
          python tools/sync_profile_engine.py \
            --source "$MEROSS_CLOUD_REPO" --check

      - name: Check documentation translations
        run: python tools/check_docs_translations.py

      - name: Lint the bundled profiles
        working-directory: meross_local_broker/rootfs/opt/custom_broker
        run: python profile_lint.py

      - name: Run the broker test suite
        working-directory: meross_local_broker/rootfs/opt/custom_broker
        run: |
          python -m pytest -q \
            --junitxml="${GITHUB_WORKSPACE}/reports/broker.xml"

      - name: Run the broker test suite across process timezones
        working-directory: meross_local_broker/rootfs/opt/custom_broker
        run: |
          for tz in Europe/Paris America/New_York; do
            echo "::group::TZ=$tz"
            TZ="$tz" python -m pytest -q \
              --junitxml="${GITHUB_WORKSPACE}/reports/broker-${tz//\//-}.xml"
            echo "::endgroup::"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-reports
          path: reports/
          if-no-files-found: ignore

  addon_lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@v2.21.2
        with:
          path: "./meross_local_broker"

  standalone:
    name: Standalone
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download the current image
        uses: actions/download-artifact@v8
        with:
          name: broker-image
          path: ${{ runner.temp }}
      - name: Load the current image
        run: gunzip -c "$RUNNER_TEMP/broker-image.tar.gz" | docker load
      - name: Run the standalone container
        env:
          IMAGE: meross-local-broker:ci
        run: bash tools/test_standalone_docker.sh
      - name: Container logs on failure
        if: failure()
        run: docker logs meross-standalone-smoke 2>&1 | tail -100

  e2e:
    name: E2E Docker
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Download the current image
        uses: actions/download-artifact@v8
        with:
          name: broker-image
          path: ${{ runner.temp }}
      - name: Load the current image
        run: gunzip -c "$RUNNER_TEMP/broker-image.tar.gz" | docker load

      - name: Check out the integration
        uses: actions/checkout@v7
        with:
          repository: mazkagaz/meross-local-cloud
          ref: 78c0e10eb1ff627e75ef07d243462402ea11f814
          path: cloud-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the HA test client
        run: python -m pip install --quiet aiohttp paho-mqtt

      - name: Run the Docker end-to-end test
        env:
          CLOUD_ROOT: ${{ github.workspace }}/cloud-src
          HA_PYTHON: python
          BROKER_IMAGE: meross-local-broker:ci
        run: bash tests/docker/run.sh

      - name: Container state on failure
        if: failure()
        run: docker ps -a

  supervisor:
    name: Supervisor
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the Supervisor run directory
        run: sudo mkdir -p /run/supervisor/core
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run the add-on under a real Supervisor
        env:
          BASE_IMAGE: ghcr.io/mazkagaz/amd64-meross_local_broker:ci-${{ github.sha }}
        run: bash tests/supervisor/run.sh
      - name: Container state on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 120 hassio_supervisor_ci 2>&1 || true
          docker logs --tail 120 app_local_meross_broker_ci 2>&1 || true

  webui:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: meross_local_broker/addon_web_ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meross_local_broker/addon_web_ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run write:env -s && npx ng test --configuration=ci --watch=false
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CHROME_BIN: /usr/bin/google-chrome
      - name: Build Web UI
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Verify Web UI output layout
        run: |
          test -f ../rootfs/var/www/index.html
          test -f ../rootfs/var/www/assets/env.js
          test ! -d ../rootfs/var/www/browser
      - name: Upload Web UI build
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: meross_local_broker/rootfs/var/www
          if-no-files-found: error

  image:
    name: Image
    needs: webui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download Web UI build
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: meross_local_broker/rootfs/var/www
      - name: Build the current image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm \
            --build-arg BUILD_ARCH=amd64 \
            -t meross-local-broker:ci \
            meross_local_broker
      - name: Smoke-test the current image
        run: IMAGE=meross-local-broker:ci bash tools/test_image_startup.sh
      - name: Publish the CI image for Supervisor
        run: |
          IMAGE_REF="ghcr.io/mazkagaz/amd64-meross_local_broker:ci-${GITHUB_SHA}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag meross-local-broker:ci "$IMAGE_REF"
          docker push "$IMAGE_REF"
      - name: Save the image for downstream jobs
        run: docker save meross-local-broker:ci | gzip -1 > "$RUNNER_TEMP/broker-image.tar.gz"
      - name: Upload the image artifact
        uses: actions/upload-artifact@v7
        with:
          name: broker-image
          path: ${{ runner.temp }}/broker-image.tar.gz
          if-no-files-found: error

  gate:
    name: CI
    needs:
      - tests
      - addon_lint
      - standalone
      - e2e
      - supervisor
      - webui
      - image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
