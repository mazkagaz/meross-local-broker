configuration:
  reinit_db:
    name: Reset database on startup
    description: >-
      Delete the local account and every paired device when the add-on starts.
      Use this only to recover from a corrupted database.
  advertise:
    name: Advertise the local API
    description: >-
      Announce the MQTT broker and the HTTPS API over mDNS so Meross Local
      Pairer can discover Home Assistant automatically. Disable only when mDNS
      is unavailable on your network.
  debug_mode:
    name: Debug logging
    description: >-
      Write detailed logs for troubleshooting. Keep disabled for normal use.
  device_timezone:
    name: Device timezone
    description: >-
      Timezone pushed to paired devices, for example Europe/Paris. Leave empty
      to use the Home Assistant timezone.
  legacy_user_topic_acks:
    name: Legacy ACKs on the user topic
    description: >-
      Also deliver command ACKs on /app/<userId>/subscribe in addition to the
      requesting app topic. Keep enabled for older clients; this temporary
      compatibility option will be removed in a later release.
  mqtt_integrity_mode:
    name: MQTT message integrity
    description: >-
      Check device publications for a valid signature, a fresh timestamp and
      replays. "observe" logs mismatches and keeps processing messages;
      "enforce" rejects invalid ones. Keep "observe" until device logs are
      clean, then switch to "enforce".
