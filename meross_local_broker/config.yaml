# Modified or added for the MRS100 fork of ha-meross-local-broker (2026-11).
# Upstream: https://github.com/albertogeniola/ha-meross-local-broker (Apache-2.0).
name: "Meross Local Broker"
version: "1.6.3"
description: "LAN-only Meross broker (MQTT/TLS + HTTP/HTTPS API, HTTPS by default) for Home Assistant."
slug: "meross_local_broker"
image: "ghcr.io/mazkagaz/{arch}-meross_local_broker"
arch:
  - aarch64
  - amd64
init: false
ports:
  2001/tcp: 2001
  2004/tcp: 2004
ports_description:
  2001/tcp: "MQTT Broker port (TLS)"
  2004/tcp: "HTTPS API port (TLS)"
ingress: true
ingress_port: 2003
startup: services
panel_icon: mdi:power-socket-us
panel_title: Meross Local Broker
host_dbus: true
hassio_api: true
homeassistant: "1.0.0"
options:
  reinit_db: false
  advertise: true
  debug_mode: false
  device_timezone: ""
  mqtt_integrity_mode: "observe"
  mqtt_auth_rate_limit: false
schema:
  reinit_db: "bool"
  advertise: "bool"
  debug_mode: "bool"
  device_timezone: "str?"
  mqtt_integrity_mode: "list(observe|enforce)"
  mqtt_auth_rate_limit: "bool"
