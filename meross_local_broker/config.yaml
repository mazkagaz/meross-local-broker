name: "Meross Local Broker"
version: "0.0.1-alpha82"
description: "LAN-only Meross broker (MQTT/TLS + HTTP/HTTPS API, HTTPS by default) for Home Assistant."
slug: "meross_local_broker"
image: "ghcr.io/mazkagaz/{arch}-meross_local_broker"
arch:
  - aarch64
  - amd64
init: false
ports:
  2001/tcp: 2001
  2003/tcp: 2003
  2004/tcp: 2004
ports_description:
  2001/tcp: "MQTT Broker port (TLS)"
  2003/tcp: "HTTP API port"
  2004/tcp: "HTTPS API port (TLS)"
ingress: true
ingress_port: 2003
startup: services
panel_icon: mdi:power-socket-us
panel_title: Meross Local Broker
host_dbus: true
homeassistant: "1.0.0"
options:
  reinit_db: false
  advertise: true
  debug_mode: false
  device_timezone: ""
  enable_https: true
  mqtt_integrity_mode: "observe"
schema:
  reinit_db: "bool"
  advertise: "bool"
  debug_mode: "bool"
  device_timezone: "str?"
  enable_https: "bool"
  mqtt_integrity_mode: "list(observe|enforce)"
