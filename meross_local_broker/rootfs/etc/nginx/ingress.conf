# Run nginx on the foreground
daemon off;

# This is run inside Docker.
user root;

# Pid storage location.
pid /var/run/nginx.pid;

# Set number of worker processes.
worker_processes 1;

# Write error log to the add-on log.
error_log /dev/stdout warn;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

events {
        worker_connections 512;
}

http {
    include  /etc/nginx/includes/mime.types;
    default_type        application/octet-stream;
    sendfile            on;
    keepalive_timeout   65;
    proxy_read_timeout  1200;
    gzip                on;
    gzip_disable        "msie6";

    error_log /dev/stdout info;
    access_log /dev/stdout combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Ingress
    server {
        listen %%ingress_interface%%:%%ingress_port%% default_server;

        # The following rule allows inbound traffic to nginx. 
        # HomeAssistant Ingress -> allow   172.30.32.2;
        # Rest of the world -> 0.0.0.0/0
        allow %%whitelisted_inbound_cidr%%;
        
        # Deny all the rest
        deny    all;

        server_name _;
        error_log /dev/stdout info;
        access_log /dev/stdout combined;

        root    /var/www;
        add_header Cache-Control "no-store";

        # CA used by the MQTT and HTTPS listeners. Clients may fetch it here
        # before pinning it; compare the fingerprint out of band.
        location = /ca.crt {
            # Inherits the server ACL: ingress (Supervisor) only.
            alias /data/mqtt/certs/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="meross-local-ca.crt"';
        }

        location /v1 {
            # Inherits the server ACL: ingress (Supervisor) only.
            # Devices and apps use the HTTPS listener on 2004.
            proxy_pass http://backend;
            proxy_set_header Host            $host:$server_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location %%ingress_entry%% {
            rewrite  ^%%ingress_entry%%/(.*)  /$1 break;
            try_files $uri$args $uri$args/ $uri/ /index.html;
        }

        location /_admin_ {
            # Allow API calls to /_admin_ path from HA web-ui only
            allow %%whitelisted_inbound_cidr%%;
            deny all;
            proxy_pass http://backend;
        }
    }

    # BEGIN HTTPS SERVER
    # HTTPS listener for LAN clients (pairer and Home Assistant integration).
    # Port 2003 stays plain HTTP for Home Assistant ingress and clients that
    # have not migrated yet. Removed at startup when enable_https is false.
    server {
        listen 2004 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate     /data/mqtt/certs/server.crt;
        ssl_certificate_key /data/mqtt/certs/server.key;

        server_name _;
        error_log /dev/stdout info;
        access_log /dev/stdout combined;

        root /var/www;
        add_header Cache-Control "no-store";

        location = /ca.crt {
            allow 0.0.0.0/0;
            alias /data/mqtt/certs/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="meross-local-ca.crt"';
        }

        location /v1 {
            allow 0.0.0.0/0;
            proxy_pass http://backend;
            proxy_set_header Host            $host:$server_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_admin_ {
            allow %%whitelisted_inbound_cidr%%;
            deny all;
            proxy_pass http://backend;
        }

        location / {
            try_files $uri$args $uri$args/ $uri/ /index.html;
        }
    }
    # END HTTPS SERVER

    upstream backend {
        server 127.0.0.1:2002;
    }

}